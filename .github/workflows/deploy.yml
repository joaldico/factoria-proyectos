name: Deploy Factoria Core to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: factoria-core 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Factoria Backend (C#)
        run: |
          # AQUI ESTÁ LA MAGIA: Apuntamos al contexto exacto igual que en tu docker-compose
          docker build -t ${{ secrets.DOCKER_USERNAME }}/factoria-backend:latest ./backend/src/Factoria.Proyectos.Api
          docker push ${{ secrets.DOCKER_USERNAME }}/factoria-backend:latest

      - name: Build and Push Factoria Frontend (React Host)
        run: |
          # Inyectamos las URLs para Vite durante la construcción
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            --build-arg VITE_TAXIMETRO_URL="${{ secrets.VITE_TAXIMETRO_URL }}" \
            -t ${{ secrets.DOCKER_USERNAME }}/factoria-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/factoria-frontend:latest

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Limpiar contenedores viejos
            docker container stop factoria_padre_backend factoria_padre_frontend || true
            docker container rm factoria_padre_backend factoria_padre_frontend || true
            docker image rm ${{ secrets.DOCKER_USERNAME }}/factoria-backend:latest ${{ secrets.DOCKER_USERNAME }}/factoria-frontend:latest || true
            
            # Descargar nuevas imágenes
            docker pull ${{ secrets.DOCKER_USERNAME }}/factoria-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/factoria-frontend:latest
            
            # Correr Backend (C#) con TUS variables personalizadas
            docker run -d --name factoria_padre_backend \
              -p 5073:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e _ConexionBD="${{ secrets.DB_CONNECTION_STRING }}" \
              -e _JwtKey="${{ secrets.JWT_SECRET_KEY }}" \
              -e LogSettings__RutaLog="./Logs" \
              -e _AWSBucket="${{ secrets.AWS_BUCKET_NAME }}" \
              -e _AWSAccessKey="${{ secrets.AWS_ACCESS_KEY }}" \
              -e _AWSSecretKey="${{ secrets.AWS_SECRET_KEY }}" \
              -e _AWSRegion="${{ secrets.AWS_REGION_CODE }}" \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/factoria-backend:latest
            
            # Correr Frontend (Host)
            docker run -d --name factoria_padre_frontend \
              -p 3003:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/factoria-frontend:latest
          EOF